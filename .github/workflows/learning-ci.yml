name: Learning CI

on:
  push:
    branches:
      - learning-ci

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  learn:
    name: First CI Job
    runs-on: ubuntu-latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Show a welcome message
        uses: echo "My first GloboTicket CI workflow!"

      - name: Check the repository contents
        run: ls -la
