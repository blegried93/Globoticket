name: Compile GloboTicket

on:
  push:
    branches:
      - learning-ci
  workflow_dispatch:

jobs:
  build:
    name: Build .NET Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore globoticket.sln

      - name: Build solution
        run: dotnet build globoticket.sln --configuration Release --no-restore